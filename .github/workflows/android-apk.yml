# Builds an installable Android APK on GitHub's servers and publishes it as a
# GitHub Release, so it can be downloaded straight onto a phone:
#   https://github.com/<owner>/<repo>/releases/latest/download/HydraTap.apk
name: Android APK

on:
  push:
    branches: [Version1]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # arm64-v8a covers virtually all Android phones from the last ~8 years.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk HydraTap.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          gh release create "$TAG" HydraTap.apk \
            --target "${{ github.sha }}" \
            --title "HydraTap for Android (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap **HydraTap.apk** and allow installing apps from your browser. Built from ${{ github.sha }}." \
            --latest
